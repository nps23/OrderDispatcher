services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://order_dispatcher:order_dispatcher@db:5432/order_dispatcher
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: order_dispatcher
      POSTGRES_USER: order_dispatcher
      POSTGRES_PASSWORD: order_dispatcher
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_dispatcher -d order_dispatcher"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
